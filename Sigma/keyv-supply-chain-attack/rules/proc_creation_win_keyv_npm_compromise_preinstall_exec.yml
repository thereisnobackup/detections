title: Execution Of The Preinstall script By Compromised Keyv Npm Package
id: dcfc9d76-da69-4119-a39c-c92de13ebb47
status: experimental
description: |
    Detects execution of the perinstall script by the compromised
    keyv npm package.
references:
    - https://socket.dev/supply-chain-attacks/keyv-and-cacheable-compromise
author: thereisnobackup
date: 2026-08-05
tags:
    - attack.initial-access
    - attack.t1195.001
    - attack.execution
    - attack.t1059.007
    - attack.stealth
    - attack.t1027.009
    - detection.emerging-threats
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|contains: '\node'
        CommandLine|contains: 'setup.mjs'
    condition: selection
falsepositives:
    - Unknown
level: medium
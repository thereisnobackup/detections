title: NodeJS Suspicious Detached Child Process Execution
id: dcfc9d76-da69-4119-a39c-c92de13ebb46
status: experimental
description: |
    Detects a generic Node.js loader pattern inspired by the AsyncAPI npm supply chain compromise, 
    where obfuscated inline JavaScript downloads a payload, writes it to disk, and executes it
    through a detached, hidden child process.
references:
    - https://www.aikido.dev/blog/asyncapi-npm-packages-backdoored-via-github-actions
author: thereisnobackup
date: 2026-07-26
tags:
    - attack.initial-access
    - attack.t1195.001
    - attack.execution
    - attack.t1059.007
    - attack.stealth
    - attack.t1027.009
    - detection.emerging-threats
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        ParentImage|contains: '\node'
        Image|contains: '\node'
        CommandLine|contains: 
            - 'require('
            - 'child_process'
            - 'http'
            - 'createWriteStream'
            - 'detached'
            - 'windowsHide'
            - '!![]'
    condition: selection
falsepositives:
    - Unknown
level: medium